interface:
  display_name: "vidIQ Video Draft"
  short_description: "Draft, judge, and fix a video before you film it"
  default_prompt: "Use $vidiq-video-draft to build a draft of my video about [topic] before I film it, and tell me what each paid step costs first."

dependencies:
